<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>DigiSpark Admin</title>
<link rel="stylesheet" href="style.css">
<style>
.admin{max-width:1100px;margin:50px auto;padding:0 20px}.admin h1{color:var(--dark-maroon)}.toolbar{display:flex;gap:10px;margin:20px 0;flex-wrap:wrap}#key{max-width:350px}.table-wrap{overflow:auto;border:1px solid var(--border);border-radius:12px}table{width:100%;border-collapse:collapse;background:#fff}th,td{padding:13px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}th{background:var(--soft);color:var(--dark-maroon)}select.status{padding:7px;border:1px solid var(--border);border-radius:7px}#msg{font-weight:600;color:var(--maroon)}
</style></head>
<body>
<main class="admin">
<p class="tag">DIGISPARK ADMIN</p><h1>Enquiry Dashboard</h1>
<p>View and update customer enquiries.</p>
<div class="toolbar"><input id="key" type="password" placeholder="Admin key (if configured)"><button class="btn primary" id="load">Load Enquiries</button></div>
<p id="msg"></p><div class="table-wrap"><table><thead><tr><th>ID</th><th>Customer</th><th>Service</th><th>Message</th><th>Status</th><th>Date</th></tr></thead><tbody id="rows"><tr><td colspan="6">Enter admin key if required, then click Load Enquiries.</td></tr></tbody></table></div>
</main>
<script>
const API="https://digispark-v0hl.onrender.com";
const key=()=>document.getElementById('key').value.trim();
const headers=()=>key()?{'x-admin-key':key()}:{};
async function load(){const msg=document.getElementById('msg');msg.textContent='Loading...';try{const r=await fetch(API+'/api/admin/enquiries',{headers:headers()});const d=await r.json();if(!r.ok)throw Error(d.message);document.getElementById('rows').innerHTML=d.enquiries.map(e=>`<tr><td>${e.id}</td><td><b>${escapeHtml(e.name)}</b><br>${escapeHtml(e.email)}</td><td>${escapeHtml(e.service)}</td><td>${escapeHtml(e.message)}</td><td><select class="status" data-id="${e.id}">${['new','contacted','in_progress','completed','cancelled'].map(s=>`<option value="${s}" ${s===e.status?'selected':''}>${s}</option>`).join('')}</select></td><td>${new Date(e.created_at).toLocaleString()}</td></tr>`).join('');msg.textContent=`${d.count} enquiries loaded.`;document.querySelectorAll('.status').forEach(x=>x.onchange=update)}catch(e){msg.textContent='❌ '+e.message}}
async function update(ev){const r=await fetch(API+'/api/admin/enquiries/'+ev.target.dataset.id,{method:'PATCH',headers:{'Content-Type':'application/json',...headers()},body:JSON.stringify({status:ev.target.value})});if(!r.ok){const d=await r.json();alert(d.message||'Update failed')}}
function escapeHtml(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
document.getElementById('load').onclick=load;
</script></body></html>
