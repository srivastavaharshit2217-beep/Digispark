<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>DigiSpark Admin</title><link rel="stylesheet" href="style.css"><style>.admin{max-width:1100px;margin:50px auto;padding:0 20px}.admin h1{color:var(--dark-maroon)}.toolbar{display:flex;gap:10px;margin:20px 0;flex-wrap:wrap}.toolbar input{max-width:350px}.table-wrap{overflow:auto;border:1px solid var(--border);border-radius:12px}table{width:100%;border-collapse:collapse;background:#fff}th,td{padding:13px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}th{background:var(--soft);color:var(--dark-maroon)}select.status{padding:7px;border:1px solid var(--border);border-radius:7px}#msg{font-weight:600;color:var(--maroon)}.empty{padding:25px;text-align:center}</style></head><body><main class="admin"><p class="tag">DIGISPARK ADMIN</p><h1>Enquiry Dashboard</h1><p>All customer enquiries will appear automatically after you enter your admin key.</p><div class="toolbar"><input id="key" type="password" placeholder="Admin key" autocomplete="current-password"><button class="btn primary" id="load">Load / Refresh</button></div><p id="msg"></p><div class="table-wrap"><table><thead><tr><th>ID</th><th>Customer</th><th>Service</th><th>Message</th><th>Status</th><th>Date</th></tr></thead><tbody id="rows"><tr><td colspan="6" class="empty">Enter your admin key. Enquiries will load automatically.</td></tr></tbody></table></div></main><script>const API="https://digispark-v0hl.onrender.com";const input=document.getElementById('key');const msg=document.getElementById('msg');const rows=document.getElementById('rows');const headers=()=>input.value.trim()?{'x-admin-key':input.value.trim()}:{};async function load(){msg.textContent='Loading enquiries...';try{const r=await fetch(API+'/api/admin/enquiries',{headers:headers()});const d=await r.json();if(!r.ok)throw Error(d.message||'Unable to load enquiries');if(!d.enquiries.length){rows.innerHTML='<tr><td colspan="6" class="empty">No enquiries yet.</td></tr>'}else{rows.innerHTML=d.enquiries.map(e=>`<tr><td>${e.id}</td><td><b>${escapeHtml(e.name)}</b><br>${escapeHtml(e.email)}</td><td>${escapeHtml(e.service)}</td><td>${escapeHtml(e.message)}</td><td><select class="status" data-id="${e.id}">${['new','contacted','in_progress','completed','cancelled'].map(s=>`<option value="${s}" ${s===e.status?'selected':''}>${s}</option>`).join('')}</select></td><td>${new Date(e.created_at).toLocaleString()}</td></tr>`).join('');document.querySelectorAll('.status').forEach(x=>x.onchange=update)}msg.textContent=`${d.count} enquiries loaded.`}catch(e){msg.textContent='❌ '+e.message}}async function update(ev){const r=await fetch(API+'/api/admin/enquiries/'+ev.target.dataset.id,{method:'PATCH',headers:{'Content-Type':'application/json',...headers()},body:JSON.stringify({status:ev.target.value})});if(!r.ok){const d=await r.json();alert(d.message||'Update failed')}}function escapeHtml(s){return String(s).replace(/[&<>\'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}document.getElementById('load').onclick=load;input.addEventListener('keydown',e=>{if(e.key==='Enter')load()});</script></body></html>
