<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>DigiSpark Admin | Lead CRM</title><link rel="stylesheet" href="style.css"><style>.admin{max-width:1180px;margin:40px auto;padding:0 18px}.admin-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}.admin h1{font-size:clamp(32px,5vw,50px);line-height:1.05;margin:8px 0}.admin-sub{color:#777}.toolbar{display:flex;gap:10px;margin:25px 0;flex-wrap:wrap}.toolbar input,.toolbar select{min-height:44px;border:1px solid #ddd;border-radius:9px;padding:10px 12px;background:#fff}.toolbar input{flex:1;min-width:210px}.toolbar select{min-width:150px}.lead-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:25px 0}.lead-stat{background:#fff;border:1px solid #e5e5e5;border-radius:14px;padding:18px}.lead-stat strong{display:block;font-size:28px;color:#a87508}.lead-stat span{font-size:12px;color:#777}.admin-links{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 20px}.admin-links a{display:inline-flex;align-items:center;gap:7px;padding:10px 14px;border:1px solid #ddd;border-radius:9px;background:#fff;font-weight:800;text-decoration:none}.admin-links a:hover{background:#f5b72b;color:#050505}.table-wrap{overflow:auto;border:1px solid #e2e2e2;border-radius:14px;background:#fff}table{width:100%;border-collapse:collapse;min-width:1150px}th,td{padding:14px;border-bottom:1px solid #eee;text-align:left;vertical-align:top}th{background:#0b0b0b;color:#ffd866;font-size:12px;text-transform:uppercase;letter-spacing:.5px}tr:hover td{background:#fffaf0}.customer-name{font-weight:800}.customer-email{font-size:12px;color:#777}.contact-actions{display:flex;gap:7px;margin-top:9px;flex-wrap:wrap}.contact-actions a{display:inline-flex;padding:6px 9px;border-radius:7px;background:#f5f5f5;font-size:11px;font-weight:800;text-decoration:none}.contact-actions a:hover{background:#f5b72b;color:#050505}.track-link{display:inline-flex;margin-top:9px;padding:7px 10px;border-radius:8px;background:#111;color:#ffd866;font-size:11px;font-weight:800;text-decoration:none}.track-link:hover{background:#f5b72b;color:#050505}.status{padding:7px;border:1px solid #ddd;border-radius:7px;background:#fff;font-weight:700}.budget{font-weight:800;color:#a87508}.empty{padding:30px;text-align:center;color:#777}#msg{font-weight:700;margin:10px 0}.danger{color:#b42318}@media(max-width:800px){.lead-stats{grid-template-columns:repeat(2,1fr)}.admin{margin:25px auto}.toolbar{flex-direction:column}.toolbar input,.toolbar select{width:100%}}@media(max-width:450px){.lead-stats{grid-template-columns:1fr 1fr}.lead-stat strong{font-size:22px}}</style></head><body><main class="admin"><div class="admin-head"><div><p class="tag">DIGISPARK ADMIN CRM</p><h1>Lead Dashboard</h1><p class="admin-sub">Manage enquiries, follow-ups and customer leads from one place.</p></div></div><div class="admin-links"><a href="analytics.html">📊 Analytics</a><a href="client-status.html" target="_blank" rel="noopener">🔎 Client Tracking Page</a></div><div class="toolbar"><input id="key" type="password" placeholder="Enter admin key" autocomplete="current-password"><input id="search" type="search" placeholder="Search name, email, phone or service"><select id="filter"><option value="all">All Status</option><option value="new">New</option><option value="contacted">Contacted</option><option value="in_progress">In Progress</option><option value="completed">Completed</option><option value="cancelled">Cancelled</option></select><button class="btn primary" id="load">Load / Refresh</button></div><div class="lead-stats"><div class="lead-stat"><strong id="total">0</strong><span>Total Leads</span></div><div class="lead-stat"><strong id="newCount">0</strong><span>New Leads</span></div><div class="lead-stat"><strong id="activeCount">0</strong><span>Active Leads</span></div><div class="lead-stat"><strong id="doneCount">0</strong><span>Completed</span></div></div><p id="msg"></p><div class="table-wrap"><table><thead><tr><th>ID</th><th>Customer</th><th>Service</th><th>Project</th><th>Budget</th><th>Details</th><th>Status</th><th>Date</th></tr></thead><tbody id="rows"><tr><td colspan="8" class="empty">Enter your admin key and click Load / Refresh.</td></tr></tbody></table></div></main><script>const API='https://digispark-v0hl.onrender.com';const input=document.getElementById('key'),search=document.getElementById('search'),filter=document.getElementById('filter'),msg=document.getElementById('msg'),rows=document.getElementById('rows');let enquiries=[];const headers=()=>input.value.trim()?{'x-admin-key':input.value.trim()}:{};function escapeHtml(s){return String(s??'').replace(/[&<>\'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function render(){const q=search.value.trim().toLowerCase(),f=filter.value;const list=enquiries.filter(e=>(f==='all'||e.status===f)&&(!q||[e.name,e.email,e.phone,e.service,e.project_type,e.budget].some(v=>String(v??'').toLowerCase().includes(q))));rows.innerHTML=list.length?list.map(e=>{const phone=String(e.phone??'').replace(/\D/g,'');const wa=phone?`https://wa.me/${phone.startsWith('91')?phone:'91'+phone}`:'#';const track=e.tracking_token?`<a class="track-link" href="client-status.html?token=${encodeURIComponent(e.tracking_token)}" target="_blank" rel="noopener">🔎 Track Client</a>`:'';return `<tr><td><b>#${e.id}</b></td><td><div class="customer-name">${escapeHtml(e.name)}</div><div class="customer-email">${escapeHtml(e.email)}</div><div class="contact-actions">${phone?`<a href="tel:+${phone}">📞 Call</a><a href="${wa}" target="_blank" rel="noopener">💬 WhatsApp</a>`:''}</div>${track}</td><td>${escapeHtml(e.service)}</td><td>${escapeHtml(e.project_type||'—')}</td><td class="budget">${escapeHtml(e.budget||'—')}</td><td>${escapeHtml(e.message)}</td><td><select class="status" data-id="${e.id}">${['new','contacted','in_progress','completed','cancelled'].map(s=>`<option value="${s}" ${s===e.status?'selected':''}>${s.replace('_',' ')}</option>`).join('')}</select></td><td>${e.created_at?new Date(e.created_at).toLocaleString():'—'}</td></tr>`}).join(''):'<tr><td colspan="8" class="empty">No matching leads found.</td></tr>';document.querySelectorAll('.status').forEach(x=>x.onchange=update)}function stats(){const total=enquiries.length,n=enquiries.filter(e=>e.status==='new').length,a=enquiries.filter(e=>['contacted','in_progress'].includes(e.status)).length,d=enquiries.filter(e=>e.status==='completed').length;document.getElementById('total').textContent=total;document.getElementById('newCount').textContent=n;document.getElementById('activeCount').textContent=a;document.getElementById('doneCount').textContent=d}async function load(){msg.textContent='Loading leads...';msg.classList.remove('danger');try{const r=await fetch(API+'/api/admin/enquiries',{headers:headers()});const d=await r.json();if(!r.ok)throw Error(d.message||'Unable to load enquiries');enquiries=d.enquiries||[];stats();render();msg.textContent=`${enquiries.length} lead${enquiries.length===1?'':'s'} loaded.`}catch(e){msg.textContent='❌ '+e.message;msg.classList.add('danger')}}async function update(ev){try{const r=await fetch(API+'/api/admin/enquiries/'+ev.target.dataset.id,{method:'PATCH',headers:{'Content-Type':'application/json',...headers()},body:JSON.stringify({status:ev.target.value})});if(!r.ok){const d=await r.json();throw Error(d.message||'Update failed')}const item=enquiries.find(e=>String(e.id)===String(ev.target.dataset.id));if(item)item.status=ev.target.value;stats();render()}catch(e){alert(e.message);load()}}document.getElementById('load').onclick=load;input.addEventListener('keydown',e=>{if(e.key==='Enter')load()});search.addEventListener('input',render);filter.addEventListener('change',render);</script></body></html>
